# Every version used by the Android build (D030, D032, D034). No version literals in build files.
[versions]
android-compileSdk = "36"
android-targetSdk = "36"
android-minSdk = "29"
ndk = "27.1.12297006"
agp = "9.4.1"
kotlin = "2.4.21"
compose-bom = "2026.06.00"
activity-compose = "1.13.0"
core-ktx = "1.18.0"
lifecycle = "2.10.0"  # newest with minCompileSdk <= 36 (D034); 2.11.0 needs 37
navigation-compose = "2.9.8"
koin = "4.2.2"
coroutines = "1.11.0"
serialization = "1.11.0"
ktor = "3.6.0"
okhttp = "5.4.0"
onnxruntime = "1.31.0"
sqldelight = "2.4.1"
datastore = "1.2.1"
annotation = "1.9.1"
